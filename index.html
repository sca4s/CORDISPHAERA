<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta id="themeColorMeta" name="theme-color" content="#F7F2FA" />
  <title>CORDISPHAERA — Harmonia Kinetica</title>

  <!-- App Icon (SVG Favicon) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23F9D8E6'/%3E%3Cstop offset='50%25' stop-color='%23CBB9FF'/%3E%3Cstop offset='100%25' stop-color='%23B5EAD7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23bg)'/%3E%3Crect x='3' y='3' width='58' height='58' rx='15' fill='rgba(255,255,255,0.68)' stroke='white' stroke-width='2'/%3E%3Ccircle cx='32' cy='32' r='21' fill='none' stroke='%239B82F3' stroke-width='2.5' stroke-dasharray='4 4'/%3E%3Cpath d='M21 13V51M32 10V54M43 13V51' stroke='%23E08DAC' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='21' cy='26' r='5' fill='%23B5EAD7' stroke='%23352D46' stroke-width='2.2'/%3E%3Cpolygon points='32,29 39,40 25,40' fill='%23FFE5D0' stroke='%23352D46' stroke-width='2.2' stroke-linejoin='round'/%3E%3Crect x='38.5' y='18.5' width='9' height='9' rx='2.2' transform='rotate(45 43 23)' fill='%23CBB9FF' stroke='%23352D46' stroke-width='2.2'/%3E%3C/svg%3E" />

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <!-- ==================== SPATIAL PASTEL WELCOME SCREEN ==================== -->
  <div id="frontScreen">
    <div class="spatial-glass float-card relative max-w-md w-full rounded-[36px] p-6 sm:p-8 text-center">

      <!-- Top-Right Quick Theme Switcher on Welcome Card -->
      <button id="frontThemeBtn" type="button" class="pill-btn absolute top-5 right-5" title="Switch between Light and Dark Mode">
        <span id="frontThemeIcon" class="text-xs">☀️</span>
        <span id="frontThemeText" class="text-[11px]">Light</span>
      </button>

      <!-- Emblem Icon -->
      <div class="mx-auto mb-3.5 w-16 h-16 sm:w-20 sm:h-20 rounded-[24px] flex items-center justify-center shadow-md"
           style="background: linear-gradient(135deg, #F9D8E6 0%, #CBB9FF 52%, #B5EAD7 100%); padding: 3px;">
        <div class="w-full h-full rounded-[21px] flex items-center justify-center"
             style="background: rgba(255, 255, 255, 0.82); border: 1px solid rgba(255,255,255,0.96);">
          <svg width="40" height="40" viewBox="0 0 36 36" fill="none">
            <circle cx="18" cy="18" r="13.5" stroke="#9B82F3" stroke-width="2" stroke-dasharray="3 3"/>
            <path d="M12 6.5V29.5M18 4.5V31.5M24 6.5V29.5" stroke="#E08DAC" stroke-width="2.2" stroke-linecap="round"/>
            <circle cx="12" cy="15" r="3.2" fill="#B5EAD7" stroke="#352D46" stroke-width="1.5"/>
            <polygon points="18,17 22.2,23.5 13.8,23.5" fill="#FFE5D0" stroke="#352D46" stroke-width="1.5" stroke-linejoin="round"/>
            <rect x="21.5" y="10.5" width="5.2" height="5.2" rx="1.5" transform="rotate(45 24 13)" fill="#CBB9FF" stroke="#352D46" stroke-width="1.5"/>
          </svg>
        </div>
      </div>

      <!-- Signature Badge: "MADE BY SOU." -->
      <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full mb-2.5 spatial-subcard">
        <span class="w-2 h-2 rounded-full" style="background: #EB9AB8;"></span>
        <span class="text-[10.5px] font-bold tracking-[0.2em] text-subtle">"MADE BY SOU."</span>
        <span class="w-2 h-2 rounded-full" style="background: #9AC8F7;"></span>
      </div>

      <!-- App Title -->
      <h1 class="text-2xl sm:text-4xl font-extrabold tracking-tight text-ink mb-1"
          style="letter-spacing: 0.05em;">
        CORDISPHAERA
      </h1>
      <p class="text-xs sm:text-sm font-medium text-muted mb-5">
        Harmonia Kinetica &mdash; Strings, Percussion &amp; Live Notation
      </p>

      <!-- Instrument Pre-Selector Card -->
      <div class="spatial-subcard rounded-[24px] p-3.5 sm:p-4 mb-5 text-left">
        <div class="flex items-center justify-between gap-2 mb-2.5">
          <span class="text-[10.5px] font-bold uppercase tracking-wider text-muted">Choose Instrument</span>
          <span id="frontInstrumentTag" class="text-[11px] font-semibold text-subtle text-right">6 Strings &bull; Warm Wood</span>
        </div>

        <div class="segmented-control w-full grid grid-cols-3 text-center" id="frontInstrumentPicker">
          <button type="button" data-instrument="acoustic" class="segment-btn selected">Acoustic</button>
          <button type="button" data-instrument="electric" class="segment-btn">Electric</button>
          <button type="button" data-instrument="bass" class="segment-btn">Bass Guitar</button>
        </div>
      </div>

      <!-- Mini How-To Pills -->
      <div class="grid grid-cols-3 gap-2 mb-5 text-center">
        <div class="spatial-subcard rounded-[20px] p-2.5">
          <div class="text-[11.5px] font-bold text-ink">Tap Lanes</div>
          <div class="text-[10px] text-muted leading-tight mt-0.5">Drop pastel shapes</div>
        </div>
        <div class="spatial-subcard rounded-[20px] p-2.5">
          <div class="text-[11.5px] font-bold text-ink">Swipe Strings</div>
          <div class="text-[10px] text-muted leading-tight mt-0.5">Strum live chords</div>
        </div>
        <div class="spatial-subcard rounded-[20px] p-2.5">
          <div class="text-[11.5px] font-bold text-ink">Live Score</div>
          <div class="text-[10px] text-muted leading-tight mt-0.5">Auto sheet music</div>
        </div>
      </div>

      <!-- Begin Playing CTA -->
      <button id="beginBtn" class="begin-btn w-full">
        Begin Playing
      </button>
    </div>
  </div>

  <!-- ==================== COMPACT RESPONSIVE TOP HUD ==================== -->
  <header id="topHud" class="fixed top-2 sm:top-3 left-1/2 -translate-x-1/2 z-20 flex flex-wrap items-center justify-center gap-1.5 sm:gap-2 px-2.5 py-1.5 sm:px-3.5 sm:py-2 rounded-[26px] sm:rounded-full spatial-glass w-[95vw] sm:w-auto max-w-[96vw]">
    <!-- Back to Title Screen Button -->
    <button id="homeBtn" class="pill-btn" title="Return to CORDISPHAERA Title Screen">
      <svg width="16" height="16" viewBox="0 0 36 36" fill="none" class="shrink-0">
        <rect x="2" y="2" width="32" height="32" rx="9" fill="#EDE7FA" stroke="#9B82F3" stroke-width="2"/>
        <path d="M12 8V28M18 6V30M24 8V28" stroke="#E08DAC" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="12" cy="15" r="3" fill="#B5EAD7" stroke="#352D46" stroke-width="1.5"/>
        <polygon points="18,17 22,23 14,23" fill="#FFE5D0" stroke="#352D46" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
      <span class="hidden md:inline font-bold tracking-wider text-[11px]">CORDISPHAERA</span>
    </button>

    <!-- Live Instrument Segmented Control: Acoustic | Electric | Bass -->
    <div class="segmented-control" id="hudInstrumentPicker" title="Switch Guitar Timbre & Strings">
      <button type="button" data-instrument="acoustic" class="segment-btn selected">Acoustic</button>
      <button type="button" data-instrument="electric" class="segment-btn">Electric</button>
      <button type="button" data-instrument="bass" class="segment-btn">Bass</button>
    </div>

    <!-- Motion Flow Toggle -->
    <button id="flowBtn" class="pill-btn active-toggle" title="Toggle kinetic pulse travelers">
      <span class="w-2 h-2 rounded-full bg-[#8D76D9] animate-pulse" id="flowDot"></span>
      <span id="flowLabel">Flow: On</span>
    </button>

    <!-- Spawn Free-Bouncing Pastel Orb -->
    <button id="spawnOrbBtn" class="pill-btn" title="Release a free-bouncing pastel orb">
      <span>+ Orb</span>
    </button>

    <!-- Compact Tempo Control -->
    <div class="hidden sm:flex items-center gap-1.5 px-1.5 py-0.5 text-[11px] font-semibold text-muted">
      <span>Tempo</span>
      <input id="speedSlider" type="range" class="pastel-slider" min="1.0" max="5.6" step="0.2" value="2.4" />
    </div>

    <!-- Light / Dark Mode Switcher -->
    <button id="themeToggleBtn" class="pill-btn" title="Toggle between Light and Dark Mode">
      <span id="themeIcon" class="text-xs">☀️</span>
      <span id="themeLabel">Light</span>
    </button>

    <!-- Clear Shapes & Score -->
    <button id="clearBtn" class="pill-btn danger-pill" title="Clear shapes, orbs, and sheet music">
      Clear
    </button>
  </header>

  <!-- Main Interactive Canvas -->
  <canvas id="appCanvas"></canvas>

  <script type="module" src="./main.js"></script>
</body>
</html>
